name: Public Android build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Privacy gate (fail closed)
        run: python3 tools/privacy_guard.py .
      - name: Privacy gate tests
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build isolated public preview
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify APK signature and package ID
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F "package: name='es.josxtm.telecontrol.community'"
      - uses: actions/upload-artifact@v4
        with:
          name: TELECONTROL-PUBLIC-PUBLIC-PREVIEW-NO-UPDATE
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
