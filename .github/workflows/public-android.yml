name: Public Android build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Privacy gate (fail closed)
        run: python3 tools/privacy_guard.py .
      - name: Privacy gate tests
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Unit tests, Android Lint and isolated public preview
        run: gradle --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Verify APK identity, version, signature, permissions and resources
        run: python3 tools/inspect_apk.py app/build/outputs/apk/debug/app-debug.apk "$ANDROID_HOME/build-tools/35.0.0" | tee app/build/apk-verification.txt
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Real Android storage, import, recovery and launch tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: gradle --no-daemon :app:connectedDebugAndroidTest
      - name: Upload validated public preview
        uses: actions/upload-artifact@v4
        with:
          name: TELECONTROL-PUBLIC-PREVIEW-NO-PRIVATE-UPDATE
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/apk-verification.txt
          if-no-files-found: error
          retention-days: 14
      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TELECONTROL-PUBLIC-VALIDATION
          path: |
            app/build/reports/
            app/build/outputs/androidTest-results/
          if-no-files-found: ignore
          retention-days: 14
