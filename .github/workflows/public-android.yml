name: Public Android build
on:
  push:
  pull_request:
  workflow_dispatch:
concurrency:
  group: public-android-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Privacy gate (fail closed)
        run: python3 tools/privacy_guard.py .
      - name: Privacy gate tests
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Unit tests, Android Lint and two isolated public previews
        run: gradle --no-daemon :app:testMobileDebugUnitTest :app:testTabletDebugUnitTest :app:lintMobileDebug :app:lintTabletDebug :app:assembleMobileDebug :app:assembleTabletDebug :app:assembleMobileDebugAndroidTest :app:assembleTabletDebugAndroidTest
      - name: Verify both APK identities, versions, signatures, permissions and resources
        run: |
          set -euo pipefail
          python3 tools/inspect_apk.py app/build/outputs/apk/mobile/debug/app-mobile-debug.apk "$ANDROID_HOME/build-tools/35.0.0" --flavor mobile | tee app/build/mobile-verification.txt
          python3 tools/inspect_apk.py app/build/outputs/apk/tablet/debug/app-tablet-debug.apk "$ANDROID_HOME/build-tools/35.0.0" --flavor tablet | tee app/build/tablet-verification.txt
          cp app/build/outputs/apk/mobile/debug/app-mobile-debug.apk app/build/TELECONTROL-MOBILE.apk
          cp app/build/outputs/apk/tablet/debug/app-tablet-debug.apk app/build/TELECONTROL-TABLET.apk
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Real Android storage, import, recovery and launch tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          # This action runs each script line using a separate shell invocation.
          # Keep the test command single-line to avoid orphaned shell conditionals.
          script: gradle --no-daemon :app:connectedMobileDebugAndroidTest :app:connectedTabletDebugAndroidTest
      - name: Block previews until approved GUI is restored
        run: python3 tools/gui_parity_gate.py .
      - name: Upload validated public preview
        uses: actions/upload-artifact@v4
        with:
          name: TELECONTROL-PUBLIC-MOBILE-TABLET-PREVIEWS
          path: |
            app/build/TELECONTROL-MOBILE.apk
            app/build/TELECONTROL-TABLET.apk
            app/build/mobile-verification.txt
            app/build/tablet-verification.txt
          if-no-files-found: error
          retention-days: 14
      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TELECONTROL-PUBLIC-VALIDATION
          path: |
            app/build/*-verification.txt
            app/build/reports/
            app/build/outputs/androidTest-results/
          if-no-files-found: ignore
          retention-days: 14
