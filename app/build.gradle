plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'org.jetbrains.kotlin.kapt'
}

// Every public CI run has a distinct compilation number; local builds can override it.
def publicComp = (project.findProperty('publicCompilationNumber') ?: System.getenv('GITHUB_RUN_NUMBER') ?: '3').toString().toInteger()
if (publicComp < 1 || publicComp > 1_000_000) throw new GradleException('Invalid public compilation number')

android {
    namespace 'es.josxtm.telecontrol.community'
    compileSdk 35
    defaultConfig {
        applicationId 'es.josxtm.telecontrol.community'
        minSdk 23
        targetSdk 35
        versionCode (10000 + publicComp)
        versionName "v.1.0 public - comp. ${publicComp}"
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    flavorDimensions += "device"
    productFlavors {
        mobile {
            dimension "device"
            // Retain the installed public package and its existing update identity.
            manifestPlaceholders = [appDisplayName: "TELECONTROL MOBILE", mangoTaskAffinity: "es.josxtm.telecontrol.community.mangossh"]
        }
        tablet {
            dimension "device"
            applicationIdSuffix ".tablet"
            versionCode (30000 + publicComp)
            versionName "v.1.1 tablet - comp. ${publicComp}"
            manifestPlaceholders = [appDisplayName: "TELECONTROL TABLET", mangoTaskAffinity: "es.josxtm.telecontrol.community.tablet.mangossh"]
        }
    }
    packaging {
        resources.excludes += ['META-INF/DEPENDENCIES', 'META-INF/versions/**/OSGI-INF/**', 'DebugProbesKt.bin']
    }
    lint { lintConfig file('lint.xml') }
    buildFeatures {
        compose true
        buildConfig true
    }
    kotlinOptions { jvmTarget = '17' }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Restored owner-approved MangoSSH Compose Activity, read-only network diagnostics
    // and encrypted local profiles. All CT routing inputs remain local-only.
    implementation platform('androidx.compose:compose-bom:2024.12.01')
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.7'
    implementation 'androidx.room:room-runtime:2.6.1'
    implementation 'androidx.room:room-ktx:2.6.1'
    kapt 'androidx.room:room-compiler:2.6.1'
    implementation 'androidx.datastore:datastore-preferences:1.1.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'
    implementation 'org.bouncycastle:bcprov-jdk18on:1.86'
    implementation 'com.github.mwiede:jsch:2.28.8'
    implementation 'androidx.activity:activity:1.9.3'
    implementation 'androidx.camera:camera-camera2:1.4.2'
    implementation 'androidx.camera:camera-lifecycle:1.4.2'
    implementation 'androidx.camera:camera-view:1.4.2'
    implementation 'cz.adaptech.tesseract4android:tesseract4android:4.9.0'
    implementation 'androidx.work:work-runtime:2.9.1'
    implementation 'androidx.webkit:webkit:1.12.1'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:core:1.6.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
}

// Legacy Android framework tests are test-only; production has no runtime dependencies.
dependencies {
    androidTestCompileOnly files("${android.sdkDirectory}/platforms/android-35/optional/android.test.base.jar",
        "${android.sdkDirectory}/platforms/android-35/optional/android.test.runner.jar",
        "${android.sdkDirectory}/platforms/android-35/optional/android.test.mock.jar")
}

// Use pinned, publicly licensed language packs for offline OCR; never bundle CT data.
apply from: rootProject.file('gradle/cog-ocr.gradle')
